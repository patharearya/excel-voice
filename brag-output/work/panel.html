<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel Voice</title>
  <link href="taskpane.css" rel="stylesheet" type="text/css" />
<style>*{transition:none!important} body{padding:14px 14px 24px} .press{filter:brightness(.85)} .examples{margin-top:16px}</style></head>
<body>
  <main id="app-body">
    <div class="top">
      <button id="record" class="mic" aria-describedby="status">
        <svg class="icon icon-mic" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7"/></svg>
        <svg class="icon icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>
        <span id="record-label">Speak</span>
      </button>
      <div id="meter" class="meter" hidden><div id="level"></div></div>
      <input id="typed" type="text" autocomplete="off" spellcheck="false" placeholder="Or type a command and press Enter" aria-label="Type a command" />
    </div>

    <p id="transcript" class="transcript" hidden></p>
    <p id="answer" class="answer" role="status" hidden></p>
    <p id="status" class="status" role="status" aria-live="polite" data-tone="idle">Ready</p>

    <section id="preview" class="preview" hidden aria-label="What will change">
      <h2>Will change</h2>
      <ul id="changes"></ul>
      <div class="actions">
        <button id="apply" class="primary">Apply <kbd>Enter</kbd></button>
        <button id="cancel">Cancel <kbd>Esc</kbd></button>
      </div>
    </section>

    <section id="examples" class="examples" aria-label="Things you can say">
      <h2>Not sure what to say? Click one to try it.</h2>
      <ul>
        <li><button class="example">Bold the header row</button></li>
        <li><button class="example">Make the price column currency</button></li>
        <li><button class="example">Double column B</button></li>
        <li><button class="example">Total column D at the bottom</button></li>
        <li><button class="example">Sort by price, high to low</button></li>
        <li><button class="example">Copy column C to column H</button></li>
      </ul>
    </section>

    <footer id="last-bar" class="last" hidden>
      <div>
        <h2>Last change</h2>
        <p id="last"></p>
      </div>
      <button id="undo">Undo</button>
    </footer>

    <details class="settings">
      <summary>Microphone</summary>
      <label for="mic">Input device</label>
      <select id="mic"><option value="">System default</option></select>
      <p class="hint">If nothing is picked up, choose a different device here. Bluetooth headsets often record silence until they are in use.</p>
    </details>
    <details class="settings">
      <summary>Diagnostics</summary>
      <pre id="diag"></pre>
    </details>
  </main>
</body>
</html>
