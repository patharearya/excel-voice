<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excel Voice (spike)</title>
  <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link href="taskpane.css" rel="stylesheet" type="text/css" />
  <style>
    body { font: 14px system-ui, sans-serif; padding: 12px; }
    button { font-size: 18px; padding: 12px 24px; width: 100%; }
    #status { margin-top: 12px; color: #555; white-space: pre-wrap; word-break: break-all; }
    #transcript { margin-top: 12px; font-size: 16px; min-height: 2em; border: 1px solid #ccc; padding: 8px; }
  </style>
</head>
<body>
  <section id="sideload-msg">Sideload the add-in to see the panel.</section>
  <main id="app-body" style="display:none">
    <select id="mic" style="width:100%;margin-bottom:8px"></select>
    <button id="record">Record</button>
    <div id="mics" style="font-size:12px;color:#777;margin-top:6px"></div>
    <div id="meter" style="height:8px;background:#eee;margin-top:8px"><div id="level" style="height:100%;width:0;background:#2a7"></div></div>
    <div id="transcript"></div>
    <div id="status"></div>
    <div id="diag" style="font-size:12px;color:#777;margin-top:12px"></div>
  </main>
</body>
</html>
